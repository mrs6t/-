<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কাহিনীঘর — গল্পের অ্যাপ</title>
<meta name="theme-color" content="#8B2635">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F0E3;
    --surface:#FFFBF2;
    --ink:#2B1D14;
    --muted:#6B5744;
    --accent:#8B2635;
    --accent-soft:#E9C9C4;
    --gold:#C9A15C;
    --rule: rgba(43,29,20,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
    overscroll-behavior-y: none;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

  /* ---------- Header ---------- */
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--rule);
  }
  header.top .mark{
    font-family:'Tiro Bangla', serif;
    font-style:italic;
    font-size:14px;
    color:var(--accent);
    letter-spacing:0.02em;
    margin:0 0 4px;
  }
  header.top h1{
    font-family:'Tiro Bangla', serif;
    font-weight:400;
    font-size:34px;
    margin:0;
    line-height:1.15;
  }
  header.top p.sub{
    margin:8px 0 0;
    color:var(--muted);
    font-size:15px;
  }

  /* ---------- Resume strip ---------- */
  .resume{
    margin:18px 20px 0;
    padding:14px 16px;
    background:var(--surface);
    border-left:3px solid var(--gold);
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .resume.show{display:flex;}
  .resume .txt{font-size:14px;color:var(--muted);}
  .resume .txt b{color:var(--ink);font-weight:600;}
  .resume button{
    background:none;border:none;color:var(--accent);
    font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;white-space:nowrap;
  }

  /* ---------- Category tabs ---------- */
  nav.cats{
    display:flex;gap:22px;
    padding:22px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    background:none;border:none;
    font-family:'Hind Siliguri',sans-serif;
    font-size:15px;color:var(--muted);
    padding:0 0 10px;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.cats button.active{
    color:var(--ink);font-weight:600;
    border-bottom:2px solid var(--accent);
  }

  /* ---------- Story list ---------- */
  ul.list{list-style:none;margin:0;padding:6px 20px 0;}
  ul.list li{
    border-bottom:1px solid var(--rule);
  }
  ul.list li button{
    width:100%;text-align:right;
    background:none;border:none;cursor:pointer;
    padding:20px 0 20px 14px;
    display:flex;gap:14px;align-items:flex-start;
    text-align:left;
  }
  ul.list li .spine{
    width:3px;align-self:stretch;
    background:var(--gold);
    flex-shrink:0;
    min-height:52px;
  }
  ul.list li .info{flex:1;min-width:0;}
  ul.list li .info .cat{
    font-size:12px;color:var(--accent);font-weight:600;
    margin-bottom:4px;
  }
  ul.list li .info h3{
    font-family:'Tiro Bangla',serif;font-weight:400;
    font-size:21px;margin:0 0 6px;color:var(--ink);
    line-height:1.3;
  }
  ul.list li .info p{
    margin:0;font-size:14px;color:var(--muted);
    line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  ul.list li .info .meta{
    margin-top:8px;font-size:12.5px;color:var(--muted);opacity:0.8;
  }

  /* ---------- Reader ---------- */
  #reader{
    position:fixed;inset:0;background:var(--bg);
    transform:translateX(100%);
    transition:transform .28s ease;
    overflow-y:auto;
    z-index:10;
  }
  #reader.open{transform:translateX(0);}
  .reader-bar{
    position:sticky;top:0;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--rule);
    max-width:640px;margin:0 auto;
  }
  .reader-bar .back{
    background:none;border:none;cursor:pointer;
    font-family:'Hind Siliguri',sans-serif;font-size:15px;color:var(--ink);
    display:flex;align-items:center;gap:6px;
  }
  .reader-bar .fontctl{display:flex;gap:2px;align-items:center;}
  .reader-bar .fontctl button{
    width:32px;height:32px;border-radius:50%;
    border:1px solid var(--rule);background:var(--surface);
    cursor:pointer;font-size:14px;color:var(--ink);
  }
  .progress{
    position:sticky;top:65px;height:2px;background:var(--rule);
    max-width:640px;margin:0 auto;z-index:2;
  }
  .progress i{display:block;height:100%;background:var(--accent);width:0%;}

  article.story{
    max-width:640px;margin:0 auto;padding:26px 22px 60px;
  }
  article.story .cat{font-size:12px;color:var(--accent);font-weight:600;}
  article.story h2{
    font-family:'Tiro Bangla',serif;font-weight:400;
    font-size:30px;margin:10px 0 4px;line-height:1.25;
  }
  article.story .meta{font-size:13px;color:var(--muted);margin-bottom:26px;}
  article.story .body{
    font-family:'Tiro Bangla',serif;
    font-size:19px;line-height:2;
    color:var(--ink);
  }
  article.story .body p{margin:0 0 22px;}
  article.story .moral{
    margin-top:30px;padding:16px 18px;
    background:var(--surface);border-left:3px solid var(--accent);
    font-family:'Hind Siliguri',sans-serif;font-size:14.5px;color:var(--muted);
  }
  article.story .moral b{color:var(--ink);}

  footer.end{
    text-align:center;padding:30px 20px 10px;
    color:var(--muted);font-size:12.5px;
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <p class="mark">কাহিনীঘর</p>
    <h1>আজ কোন গল্প শুনবেন?</h1>
    <p class="sub">বাংলার লোককথা ও নতুন গল্পের সংকলন</p>
  </header>

  <div class="resume" id="resumeStrip">
    <div class="txt">যেখানে থেমেছিলেন — <b id="resumeTitle"></b></div>
    <button id="resumeBtn">পড়া চালিয়ে যান</button>
  </div>

  <nav class="cats" id="cats"></nav>

  <ul class="list" id="list"></ul>

  <footer class="end">সবগুলো গল্প মৌলিক রচনা — কাহিনীঘর © ২০২৬</footer>
</div>

<div id="reader" aria-hidden="true">
  <div class="reader-bar">
    <button class="back" id="backBtn">← ফিরে যান</button>
    <div class="fontctl">
      <button id="fontMinus">অ−</button>
      <button id="fontPlus">অ+</button>
    </div>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
  <article class="story" id="storyView"></article>
</div>

<script>
const STORIES = [
  {
    id: "kumor-o-chand",
    cat: "লোককথা",
    title: "কুমোর আর চাঁদের কথা",
    teaser: "এক গরিব কুমোর প্রতি রাতে চাঁদের কাছে একটাই আবদার করত — তাকেও একটু আলো ভাগ করে দিতে।",
    readTime: "৪ মিনিট",
    paras: [
      "নদীর ধারে ছোট্ট একটা গ্রামে থাকত রহিম কুমোর। মাটির হাঁড়ি-কলসি বানিয়ে সে সংসার চালাত, কিন্তু দিনের বেলা এত কাজের চাপ থাকত যে সন্ধ্যার আগে হাত ফাঁকা হতো না। রাত হলে প্রদীপ জ্বালাবার তেল কেনার সামর্থ্য তার ছিল না।",
      "তাই রহিম একটা অভ্যাস করে নিয়েছিল। প্রতি রাতে উঠোনে বসে চাঁদের দিকে তাকিয়ে সে কাজ করত। জোছনার আলোতেই চাকা ঘোরাত, মাটি ছাঁচে ফেলত। মাঝে মাঝে আকাশের দিকে চেয়ে বলত, \"তুমি তো এত আলো ছড়াও, একটুখানি আমার হাতেও দাও না।\"",
      "একদিন এক পথিক গ্রামে এসে থামল। সে দেখল, অন্ধকারেও রহিমের হাতে তৈরি হাঁড়িগুলো কেমন মসৃণ, নিখুঁত। জিজ্ঞেস করল, \"প্রদীপ ছাড়া তুমি এত সুন্দর কাজ করো কী করে?\" রহিম হাসল, \"চাঁদ আমার প্রদীপ। ও যেটুকু দেয়, আমি সেটুকু দিয়েই কাজ চালাতে শিখে গেছি।\"",
      "পথিক সেই রাতেই গ্রামের মোড়লকে গিয়ে বলল এই কুমোরের কথা। মোড়ল খুশি হয়ে রহিমকে ডেকে পাঠালেন এবং তার কাজ দেখে এতটাই মুগ্ধ হলেন যে নিজের বাড়ির জন্য বড় একটা বায়না দিলেন। সেই আয়ে রহিম প্রথমবারের মতো নিজের জন্য একটা প্রদীপ কিনতে পারল।",

    moral: "যা হাতে আছে তা দিয়েই এগোতে শেখাটাই আসল কারিগরি — বাকিটা সময়ে আসে।"
  },
  {

      "কিন্তু পরদিন থেকে শিয়াল নিজেই হরিণকে শিখিয়ে দিল কীভাবে ভোর হবার আগেই, বাঘ ঘুম থেকে ওঠার অনেক আগে পুকুরে চলে আসতে হয়। এভাবে হরিণ রোজ শান্তিতে জল খেয়ে যেত, আর বাঘও নিয়ম রক্ষা হয়েছে ভেবে সন্তুষ্ট থাকত।",

  {

    teaser: "এক রাতে কাঠুরে দেখল পরপর তিনটে অদ্ভুত স্বপ্ন — আর সকালে সেগুলোর মানে খুঁজতে বেরোল বনের পথে।",

let fontSize = 19;
const list = document.getElementById('list');
const catsNav = document.getElementById('cats');
const reader = document.getElementById('reader');
const storyView = document.getElementById('storyView');
const progressBar = document.getElementById('progressBar');

const categories = ["সব", ...Array.from(new Set(STORIES.map(s => s.cat)))];
let activeCat = "সব";

function renderCats(){
  catsNav.innerHTML = "";
  categories.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    if(c === activeCat) b.classList.add('active');
    b.onclick = () => { activeCat = c; renderCats(); renderList(); };
    catsNav.appendChild(b);
  });
}

function renderList(){
  list.innerHTML = "";
  const filtered = activeCat === "সব" ? STORIES : STORIES.filter(s => s.cat === activeCat);
  filtered.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `
      <button>
        <span class="spine"></span>
        <span class="info">
          <span class="cat">${s.cat}</span>
          <h3>${s.title}</h3>
          <p>${s.teaser}</p>
          <span class="meta">পড়ার সময় ~ ${s.readTime}</span>
        </span>
      </button>`;
    li.querySelector('button').onclick = () => openStory(s.id);
    list.appendChild(li);
  });
}

function openStory(id){
  const s = STORIES.find(x => x.id === id);
  if(!s) return;
  storyView.innerHTML = `
    <div class="cat">${s.cat}</div>
    <h2>${s.title}</h2>
    <div class="meta">পড়ার সময় ~ ${s.readTime}</div>
    <div class="body" style="font-size:${fontSize}px">
      ${s.paras.map(p => `<p>${p}</p>`).join("")}
    </div>
    <div class="moral"><b>শিক্ষা:</b> ${s.moral}</div>
  `;
  reader.classList.add('open');
  reader.setAttribute('aria-hidden','false');
  reader.scrollTop = 0;
  localStorage.setItem('lastRead', JSON.stringify({id: s.id, title: s.title}));
  updateResumeStrip();
}

function closeStory(){
  reader.classList.remove('open');
  reader.setAttribute('aria-hidden','true');
}

document.getElementById('backBtn').onclick = closeStory;
document.getElementById('fontPlus').onclick = () => {
  fontSize = Math.min(28, fontSize + 2);
  const body = storyView.querySelector('.body');
  if(body) body.style.fontSize = fontSize + "px";
};
document.getElementById('fontMinus').onclick = () => {
  fontSize = Math.max(15, fontSize - 2);
  const body = storyView.querySelector('.body');
  if(body) body.style.fontSize = fontSize + "px";
};

reader.addEventListener('scroll', () => {
  const max = reader.scrollHeight - reader.clientHeight;
  const pct = max > 0 ? (reader.scrollTop / max) * 100 : 0;
  progressBar.style.width = pct + "%";
});

function updateResumeStrip(){
  const last = localStorage.getItem('lastRead');
  const strip = document.getElementById('resumeStrip');
  if(last){
    const data = JSON.parse(last);
    document.getElementById('resumeTitle').textContent = data.title;
    strip.classList.add('show');
    document.getElementById('resumeBtn').onclick = () => openStory(data.id);
  } else {
    strip.classList.remove('show');
  }
}

renderCats();
renderList();
updateResumeStrip();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
